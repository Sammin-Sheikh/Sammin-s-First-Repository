<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 6 - Targets & Collisions</title>
  <style>
    body { margin: 0; padding: 0; background: #131b24; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    h1 { color: #fff; margin-bottom: 10px; font-size: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <h1>Week 6: Enemy Targets & Collision Detection</h1>
  <script>
    (function () {
      'use strict';
      var M = window.Matter;
      var width = 1024, height = 600;

      var engine = M.Engine.create({ gravity: { x: 0, y: 1 } });
      var render = M.Render.create({
        element: document.body, engine: engine,
        options: { width: width, height: height, wireframes: false, background: '#87CEEB' }
      });

      M.Render.run(render);
      M.Runner.run(M.Runner.create(), engine);

      var ground = M.Bodies.rectangle(512, 580, 1024, 40, { isStatic: true, render: { fillStyle: '#2e7d32' } });
      
      var pig = M.Bodies.circle(700, 520, 20, {
        density: 0.001, restitution: 0.3,
        render: { fillStyle: '#4caf50', strokeStyle: '#2e7d32', lineWidth: 2 },
        plugin: { hp: 20 }
      });

      M.Composite.add(engine.world, [ground, pig]);

      M.Events.on(engine, 'collisionStart', function (evt) {
        evt.pairs.forEach(function (pair) {
          var speedA = M.Vector.magnitude(pair.bodyA.velocity);
          var speedB = M.Vector.magnitude(pair.bodyB.velocity);
          var relSpeed = Math.abs(speedA - speedB);
          [pair.bodyA, pair.bodyB].forEach(function (b) {
            if (b.plugin && typeof b.plugin.hp === 'number' && relSpeed > 1) {
              b.plugin.hp -= relSpeed * 10;
              if (b.plugin.hp <= 0) M.Composite.remove(engine.world, b);
            }
          });
        });
      });

      M.Events.on(render, 'afterRender', function () {
        var ctx = render.context;
        ctx.save();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px sans-serif';
        ctx.fillText('Week 6: Enemy Target HP and Collision Impact System', 20, 40);
        ctx.restore();
      });
    })();
  </script>
</body>
</html>
