<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Week 3 - Destructible Structures</title>

  <style>

    body { margin: 0; padding: 0; background: #131b24; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }

    h1 { color: #fff; margin-bottom: 10px; font-size: 20px; }

  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

</head>

<body>

  <h1>Week 3: Wood Blocks & Structures</h1>

  <script>

    (function () {

      'use strict';

      var M = window.Matter;

      var width = 1024, height = 600;



      var engine = M.Engine.create({ gravity: { x: 0, y: 1 } });

      var render = M.Render.create({

        element: document.body, engine: engine,

        options: { width: width, height: height, wireframes: false, background: '#87CEEB' }

      });



      M.Render.run(render);

      M.Runner.run(M.Runner.create(), engine);



      var ground = M.Bodies.rectangle(512, 580, 1024, 40, { isStatic: true, render: { fillStyle: '#2e7d32' } });

      M.Composite.add(engine.world, [ground]);



      function createWoodBlock(x, y, w, h, density) {

        return M.Bodies.rectangle(x, y, w, h, {

          density: density || 0.002, friction: 0.5, restitution: 0.1,

          render: { fillStyle: '#d7ccc8', strokeStyle: '#8d6e63', lineWidth: 2 }

        });

      }



      function buildPyramid(startX, startY) {

        var blocks = [];

        blocks.push(createWoodBlock(startX, startY, 20, 80));

        blocks.push(createWoodBlock(startX + 90, startY, 20, 80));

        blocks.push(createWoodBlock(startX + 45, startY - 50, 110, 20));

        M.Composite.add(engine.world, blocks);

      }



      buildPyramid(700, 520);



      M.Events.on(render, 'afterRender', function () {

        var ctx = render.context;

        ctx.save();

        ctx.fillStyle = '#ffffff';

        ctx.font = 'bold 20px sans-serif';

        ctx.fillText('Week 3: Destructible Wooden Structures Built', 20, 40);

        ctx.restore();

      });

    })();

  </script>

</body>

</html>
