<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 7 - Game GUI & Menu Overlay</title>
  <style>
    body { margin: 0; padding: 0; background: #131b24; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    h1 { color: #fff; margin-bottom: 10px; font-size: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <h1>Week 7: User Interface & Menu States</h1>
  <script>
    (function () {
      'use strict';
      var M = window.Matter;
      var width = 1024, height = 600;

      var engine = M.Engine.create({ gravity: { x: 0, y: 1 } });
      var render = M.Render.create({
        element: document.body, engine: engine,
        options: { width: width, height: height, wireframes: false, background: '#87CEEB' }
      });

      M.Render.run(render);
      M.Runner.run(M.Runner.create(), engine);

      var state = 'menu';

      render.canvas.addEventListener('click', function() {
        if(state === 'menu') state = 'playing';
        else if(state === 'playing') state = 'win';
        else state = 'menu';
      });

      M.Events.on(render, 'afterRender', function () {
        var ctx = render.context;
        ctx.save();
        if (state === 'menu') {
          ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
          ctx.textAlign = 'center'; ctx.fillStyle = '#ff9800'; ctx.font = 'bold 40px sans-serif';
          ctx.fillText('2D PHYSICS PUZZLE GAME', width / 2, height / 2 - 20);
          ctx.fillStyle = '#4caf50'; ctx.font = '22px sans-serif';
          ctx.fillText('CLICK ANYWHERE TO START', width / 2, height / 2 + 40);
        } else if (state === 'playing') {
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px sans-serif';
          ctx.fillText('Level: 1 | Shots Left: 3', 20, 40);
          ctx.fillText('Click to Toggle Win Overlay', 20, 80);
        } else if (state === 'win') {
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, width, height);
          ctx.textAlign = 'center'; ctx.fillStyle = '#4caf50'; ctx.font = 'bold 48px sans-serif';
          ctx.fillText('LEVEL COMPLETED!', width / 2, height / 2);
        }
        ctx.restore();
      });
    })();
  </script>
</body>
</html>
