<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Week 1 - Core Game Setup</title>

  <style>

    body { margin: 0; padding: 0; background: #131b24; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }

    h1 { color: #fff; margin-bottom: 10px; font-size: 20px; }

  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

</head>

<body>

  <h1>Week 1: Core Physics Setup</h1>

  <script>

    (function () {

      'use strict';

      var M = window.Matter;

      var width = 1024, height = 600;



      var engine = M.Engine.create({ gravity: { x: 0, y: 1 } });

      var render = M.Render.create({

        element: document.body,

        engine: engine,

        options: { width: width, height: height, wireframes: false, background: '#87CEEB' }

      });



      M.Render.run(render);

      var runner = M.Runner.create();

      M.Runner.run(runner, engine);



      var ball = M.Bodies.circle(width / 2, 100, 30, { restitution: 0.8, render: { fillStyle: '#ff5722' } });

      var ground = M.Bodies.rectangle(width / 2, height - 20, width, 40, { isStatic: true, render: { fillStyle: '#4caf50' } });

      M.Composite.add(engine.world, [ball, ground]);



      M.Events.on(render, 'afterRender', function () {

        var ctx = render.context;

        ctx.save();

        ctx.fillStyle = '#ffffff';

        ctx.font = 'bold 20px sans-serif';

        ctx.fillText('Week 1: Matter.js Engine & Active World Physics', 20, 40);

        ctx.restore();

      });

    })();

  </script>

</body>

</html>
